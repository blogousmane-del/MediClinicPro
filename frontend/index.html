<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e4d40" />

    <!-- Polices : chargées ici, plus par un @import en tête de index.css. Un
         @import sérialise la requête derrière le CSS et bloque le rendu ; le
         preconnect ouvre la connexion à gstatic pendant que le HTML s'analyse.
         DM Sans a été retiré : trois familles étaient chargées pour deux
         usages réels. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Chargement non bloquant : la feuille des polices coûtait 810 ms de
         rendu bloqué (mesuré par Lighthouse). Le media="print" la sort du
         chemin critique, le onload la réactive une fois arrivée. Avec
         display=swap, le texte s'affiche d'abord dans la police de repli. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
    </noscript>

    <title>MediClinic, logiciel de gestion de clinique en Côte d'Ivoire</title>
    <!-- Prix : 9 000 FCFA = plan Clinique, le moins cher des plans payants
         (backend/utils/plans.js). Ces métadonnées annonçaient « à partir de
         15 000 FCFA/mois », un tarif qui n'existe dans aucun plan. Toute
         évolution tarifaire doit être répercutée ici à la main : un fichier
         HTML statique ne peut pas lire plans.js. La durée d'essai, « 7 jours »,
         est écrite à la main pour la même raison : la vitrine lit la durée réelle
         dans l'API (réglage starter_trial_days de Platform Admin), ces
         métadonnées non. Si ce réglage change, les mettre à jour. -->
    <meta name="description" content="MediClinic est le logiciel de gestion pour petites et moyennes cliniques en Côte d'Ivoire : rendez-vous, dossiers patients, pharmacie, laboratoire et facturation. Essai gratuit 7 jours, puis à partir de 9 000 FCFA/mois." />
    <link rel="canonical" href="https://mediclinicpro.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_CI" />
    <meta property="og:site_name" content="MediClinic" />
    <meta property="og:url" content="https://mediclinicpro.com/" />
    <meta property="og:title" content="MediClinic, logiciel de gestion de clinique en Côte d'Ivoire" />
    <meta property="og:description" content="Rendez-vous, dossiers patients, pharmacie, laboratoire et facturation pour les cliniques ivoiriennes. Essai gratuit 7 jours, puis à partir de 9 000 FCFA/mois." />
    <meta property="og:image" content="https://mediclinicpro.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MediClinic : toute votre clinique, de l'accueil à la caisse" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MediClinic, logiciel de gestion de clinique en Côte d'Ivoire" />
    <meta name="twitter:description" content="Rendez-vous, dossiers patients, pharmacie, laboratoire et facturation pour les cliniques ivoiriennes. Essai gratuit 7 jours, puis à partir de 9 000 FCFA/mois." />
    <meta name="twitter:image" content="https://mediclinicpro.com/og-image.png" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "MediClinic",
      "description": "Logiciel de gestion pour petites et moyennes cliniques en Côte d'Ivoire : rendez-vous, dossiers patients, pharmacie, laboratoire et facturation.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "areaServed": "CI",
      "inLanguage": "fr",
      "offers": {
        "@type": "Offer",
        "price": "9000",
        "priceCurrency": "XOF",
        "priceValidUntil": "2027-12-31",
        "unitText": "mois"
      }
    }
    </script>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
